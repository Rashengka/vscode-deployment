version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Base image of the test OpenSSH server (pinned by digest).
  - package-ecosystem: docker
    directory: /test/support/sshd
    schedule:
      interval: weekly
